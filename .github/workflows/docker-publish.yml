name: 构建并发布 Docker 镜像

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: 构建并扫描镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 判断是否允许发布
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6.6.1

      - name: 设置 Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'

      - name: 安装项目依赖
        run: uv sync --dev --frozen

      - name: 运行后端测试和静态检查
        run: |
          uv run pytest -q
          uv run ruff check gbabeldocui tests
          uv run ruff format --check gbabeldocui tests

      - name: 检查前端 JavaScript
        shell: bash
        run: |
          node --check gbabeldocui/static/js/api.js
          node --check gbabeldocui/static/js/auth.js
          node --check gbabeldocui/static/js/i18n.js

      - name: 设置镜像名称
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.enabled == 'true' }}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: 构建待扫描镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/gbabeldocui:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成 Trivy 漏洞报告
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/gbabeldocui:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: 上传 Trivy 扫描结果
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-results.sarif

      # 官方 pdf2zh-next 仍约束 gradio<5.36，当前上游依赖存在已知扫描告警。
      # PR、main 推送和正式版本标签都必须通过安全门禁后才允许发布。
      - name: PR、main 和正式发布安全门禁
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/gbabeldocui:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: 登录 GitHub Container Registry
        if: steps.release.outputs.enabled == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布已验证镜像
        if: steps.release.outputs.enabled == 'true'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          source_image="local/gbabeldocui:${GITHUB_SHA}"
          while IFS= read -r image_tag; do
            if [[ -z "$image_tag" ]]; then
              continue
            fi
            docker tag "$source_image" "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
