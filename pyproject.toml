[project]
name = "gbabeldocui"
version = "1.2"
description = "Thin multi-user Web UI adapter for official pdf2zh-next"
authors = [
    { name = "awwaawwa", email = "aw@funstory.ai" },
    { name = "Byaidu", email = "byaidux@gmail.com" },
    { name = "ghung",email = "ghungcc@gmail.com"}
]
maintainers = [
    { name = "awwaawwa", email = "aw@funstory.ai" }
]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pdf2zh-next==2.9.0",
    "babeldoc==0.6.4",
    "gradio>=6.15.0,<7.0",
    "gradio-pdf>=0.0.23,<0.1.0",
    "Pillow>=12.3.0,<13.0",
    "PyMuPDF>=1.26.7",
    "httpx>=0.28.1",
    "filelock>=3.15.0",
    "fastapi>=0.115.12",
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.34.2",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.25.2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "build",
    "bumpver>=2024.1130",
    "ruff>=0.9.2",
    "markdown-callouts>=0.4.0",
    "markdown-include>=0.8.1",
    "mkdocs-git-authors-plugin>=0.9.5",
    "mkdocs-git-committers-plugin>=0.2.3",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-material[recommended]>=9.6.4",
    "mkdocs-static-i18n>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/SocialYjj/GBabelDocUI"
Repository = "https://github.com/SocialYjj/GBabelDocUI"
Issues = "https://github.com/SocialYjj/GBabelDocUI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# pdf2zh-next 2.9.0 仍声明了过时的 Gradio、BabelDOC 和 PyMuPDF 上限。
# 本项目只调用其配置和高阶翻译接口，不启动官方旧版 Gradio 页面；覆盖这些约束以使用已修复的运行时依赖。
[tool.uv]
override-dependencies = [
    "babeldoc>=0.6.4,<0.7.0",
    "gradio>=6.15.0,<7.0",
    "gradio-pdf>=0.0.23,<0.1.0",
    "pillow>=12.3.0,<13.0",
    "pymupdf>=1.26.7",
    "starlette>=1.3.1,<2.0",
]

[project.scripts]
gbabeldocui = "gbabeldocui.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["gbabeldocui"]

[tool.flake8]
ignore = ["E203", "E261", "E501", "W503", "E741"]
max-line-length = 88



[bumpver]
current_version = "1.2"
version_pattern = "MAJOR.MINOR[.PATCH][.PYTAGNUM]"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"gbabeldocui/__init__.py" = [
    '__version__ = "{version}"'
]

[tool.ruff]
src = ["gbabeldocui"]
target-version = "py310"
show-fixes = true

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint]
ignore = [
    "E203",   # 冒号前的空格
    "E261",   # 注释前至少两个空格
    "E501",   # 行太长
    "E741",   # 变量名歧义
    "F841",   # 未使用的变量
    "C901",   # 太复杂的函数
    "S101",   # use assert
    "SIM",    # flake8-simplify
    "ARG002", # unused argument
    "S110",   # `try`-`except`-`pass` detected, consider logging the exception
    "B024",   # abstract class without abstract methods
    "S112",   # `try`-`except`-`continue` detected, consider logging the exception
    "COM812", # missing-trailing-comma
    "S603",   # `subprocess` call: check for execution of untrusted input

]
select = [
    "E",   # pycodestyle 错误
    "F",   # Pyflakes
    "N",   # PEP8 命名
    "B",   # flake8-bugbear
    "I",   # isort
    "C",   # mccabe
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "ARG", # flake8-unused-arguments
    "PTH", # 使用 pathlib
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# 设置一些规则的特定配置
[tool.ruff.lint.mccabe]
max-complexity = 10 # 函数圈复杂度阈值

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]            # 在测试文件中允许 assert
"**/__init__.py" = ["F401"]     # 允许未使用的导入
"docs/*" = ["A001"]
"gbabeldocui/main.py" = ["S104"] # Web 服务需要接受反向代理或容器外部连接
"gbabeldocui/web_api.py" = ["B008", "S104"] # FastAPI 依赖声明和服务监听的标准写法
