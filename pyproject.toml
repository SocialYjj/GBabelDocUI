[project]
name = "gbabeldocui"
version = "1.2.2"
description = "Multi-user Web UI for the BabelDOC PDF translation pipeline"
authors = [
    { name = "SocialYjj" },
]
maintainers = [
    { name = "SocialYjj" },
]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "babeldoc==0.6.4",
    "azure-ai-translation-text>=1.0.1,<2.0",
    "deepl>=1.30.0,<2.0",
    "joblib>=1.5.3,<2.0",
    "ollama>=0.6.2,<1.0",
    "openai>=2.52.0,<3.0",
    "peewee>=4.3.0,<5.0",
    "requests>=2.34.2,<3.0",
    "rich>=15.0.0,<16.0",
    "tenacity>=9.1.4,<10.0",
    "tencentcloud-sdk-python-tmt>=3.1.129,<4.0",
    "xinference-client>=3.1.0,<4.0",
    "Pillow>=12.3.0,<13.0",
    "PyMuPDF>=1.28.0,<2.0",
    "pydantic>=2.11.10,<3.0",
    "httpx>=0.28.1,<1.0",
    "filelock>=3.32.2,<4.0",
    "fastapi>=0.141.1,<1.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.52.1,<1.0",
    "bcrypt>=5.0.0,<6.0",
    "PyJWT>=2.13.0,<3.0",
    "python-multipart>=0.0.32,<1.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "build==1.5.0",
    "bumpver==2026.1132",
    "ruff==0.16.2",
    "markdown-callouts>=0.4.0",
    "markdown-include>=0.8.1",
    "mkdocs-git-authors-plugin>=0.9.5",
    "mkdocs-git-committers-plugin>=0.2.3",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-material[recommended]==9.6.23",
    "mkdocs-static-i18n>=1.3.0",
    "httpx2==2.0.0",
]

[project.urls]
Homepage = "https://github.com/SocialYjj/GBabelDocUI"
Repository = "https://github.com/SocialYjj/GBabelDocUI"
Issues = "https://github.com/SocialYjj/GBabelDocUI/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project.scripts]
gbabeldocui = "gbabeldocui.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["gbabeldocui"]

[tool.flake8]
ignore = ["E203", "E261", "E501", "W503", "E741"]
max-line-length = 88



[bumpver]
current_version = "1.2"
version_pattern = "MAJOR.MINOR[.PATCH][.PYTAGNUM]"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"gbabeldocui/__init__.py" = [
    '__version__ = "{version}"'
]

[tool.ruff]
src = ["gbabeldocui"]
target-version = "py310"
show-fixes = true
extend-exclude = ["gbabeldocui/_vendor"]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint]
ignore = [
    "E203",   # 冒号前的空格
    "E261",   # 注释前至少两个空格
    "E501",   # 行太长
    "E741",   # 变量名歧义
    "C901",   # 太复杂的函数
    "S101",   # use assert
    "COM812", # missing-trailing-comma
]
select = [
    "E",   # pycodestyle 错误
    "F",   # Pyflakes
    "N",   # PEP8 命名
    "B",   # flake8-bugbear
    "I",   # isort
    "C",   # mccabe
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "ARG", # flake8-unused-arguments
    "PTH", # 使用 pathlib
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# 设置一些规则的特定配置
[tool.ruff.lint.mccabe]
max-complexity = 10 # 函数圈复杂度阈值

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]            # 在测试文件中允许 assert
"**/__init__.py" = ["F401"]     # 允许未使用的导入
"docs/*" = ["A001"]
"gbabeldocui/main.py" = ["S104"] # Web 服务需要接受反向代理或容器外部连接
"gbabeldocui/web_api.py" = ["B008", "S104"] # FastAPI 依赖声明和服务监听的标准写法
