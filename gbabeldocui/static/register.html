<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="register.title">Create Account - GBabelDocUI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/i18n.js"></script>
</head>

<body>
    <main class="page-wrapper flex flex-center">
        <div class="container auth-container">
            <div class="glass-card fade-in">
                <div class="card-header text-center">
                    <h1 class="logo mb-sm">GBabelDocUI</h1>
                    <p class="card-subtitle" data-i18n="register.subtitle">Register a new account</p>
                </div>

                <div class="card-body">
                    <div id="disabled-message" class="alert alert-warning" role="status" hidden>
                        <strong data-i18n="register.disabled.title">Registration Disabled</strong><br>
                        <span data-i18n="register.disabled.message">New user registration is currently disabled. Please contact an administrator.</span>
                    </div>

                    <form id="register-form" hidden>
                        <div class="form-group">
                            <label class="form-label" for="username" data-i18n="register.username">Username</label>
                            <input type="text" id="username" class="form-input" autocomplete="username"
                                placeholder="Enter username" required minlength="3" maxlength="64">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="password" data-i18n="register.password">Password</label>
                            <input type="password" id="password" class="form-input" autocomplete="new-password"
                                placeholder="Enter password" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="password-confirm" data-i18n="register.password.confirm">Confirm Password</label>
                            <input type="password" id="password-confirm" class="form-input" autocomplete="new-password"
                                placeholder="Confirm password" required minlength="6">
                        </div>
                        <div id="register-error" class="form-error" role="alert" hidden></div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg mt-md"
                            data-i18n="register.btn.register">Register</button>
                    </form>
                </div>

                <div class="card-footer text-center">
                    <p class="text-muted">
                        <a href="/login.html" class="text-primary" data-i18n="register.link.login">Already have an account? Login</a>
                    </p>
                    <p class="source-links">
                        <a href="https://github.com/SocialYjj/GBabelDocUI" rel="noopener noreferrer">Source code</a>
                        <a href="https://github.com/SocialYjj/GBabelDocUI/blob/main/LICENSE" rel="noopener noreferrer">AGPL-3.0</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/register-page.js"></script>
</body>

</html>
