<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GBabelDocUI</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/i18n.js"></script>
</head>

<body>
  <main class="page-wrapper flex flex-center">
    <div class="container auth-container">
      <div class="glass-card fade-in">
        <div class="card-header text-center">
          <h1 class="logo mb-sm">GBabelDocUI</h1>
          <p class="card-subtitle" id="subtitle" data-i18n="login.welcome">Welcome back! Please login to continue.</p>
        </div>

        <div class="card-body">
          <form id="setup-form" hidden>
            <div class="alert alert-info mb-md">
              <strong data-i18n="login.setup.info">Initial Setup</strong><br>
              <span data-i18n="login.setup.desc">Create your admin account to get started.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setup-username" data-i18n="login.username">Username</label>
              <input type="text" id="setup-username" class="form-input" autocomplete="username"
                placeholder="Enter username" required minlength="3" maxlength="64">
              <span class="form-help" data-i18n="login.username.min">At least 3 characters</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setup-password" data-i18n="login.password">Password</label>
              <input type="password" id="setup-password" class="form-input" autocomplete="new-password"
                placeholder="Enter password" required minlength="6">
            </div>

            <div class="form-group">
              <label class="form-label" for="setup-password-confirm" data-i18n="login.password.confirm">Confirm Password</label>
              <input type="password" id="setup-password-confirm" class="form-input" autocomplete="new-password"
                placeholder="Confirm password" required minlength="6">
            </div>

            <div class="form-group" id="setup-token-group" hidden>
              <label class="form-label" for="setup-token">Setup token</label>
              <input type="password" id="setup-token" class="form-input" autocomplete="off"
                placeholder="GBABELDOCUI_SETUP_TOKEN">
              <span class="form-help">Required when the first account is created remotely.</span>
            </div>

            <div id="setup-error" class="form-error" role="alert" hidden></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg mt-md" data-i18n="login.btn.setup">
              Create Admin Account
            </button>
          </form>

          <form id="login-form" hidden>
            <div class="form-group">
              <label class="form-label" for="username" data-i18n="login.username">Username</label>
              <input type="text" id="username" class="form-input" autocomplete="username"
                placeholder="Enter your username" required maxlength="64">
            </div>
            <div class="form-group">
              <label class="form-label" for="password" data-i18n="login.password">Password</label>
              <input type="password" id="password" class="form-input" autocomplete="current-password"
                placeholder="Enter your password" required>
            </div>
            <div id="login-error" class="form-error" role="alert" hidden></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg mt-md" data-i18n="login.btn.login">Login</button>
          </form>
        </div>

        <div class="card-footer text-center">
          <p class="text-muted" id="registration-link" hidden>
            <a href="/register.html" class="text-primary" data-i18n="register.link.from_login">Don't have an account? Register</a>
          </p>
          <p class="text-muted" id="app-version">GBabelDocUI</p>
          <p class="source-links">
            <a href="https://github.com/SocialYjj/GBabelDocUI" rel="noopener noreferrer">Source code</a>
            <a href="https://github.com/SocialYjj/GBabelDocUI/blob/main/LICENSE" rel="noopener noreferrer">AGPL-3.0</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/login-page.js"></script>
</body>

</html>
